[project]
name = "gbk-compatibility-encoder"
version = "0.1.0"
description = "Encodes Unicode text to GBK bytes, including the Private Use Area code points that Microsoft's CP936 extension maps but the standard GBK codec rejects."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
